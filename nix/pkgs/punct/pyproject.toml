[project]
name = "punct"
version = "0.1.0"
description = "Manage which homeConfigurations entry a host uses and run home-manager switch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "tomlkit>=0.13",
]

[project.scripts]
punct = "punct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/punct"]

[dependency-groups]
dev = [
    "basedpyright>=1.13",
    "ruff>=0.6",
]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
